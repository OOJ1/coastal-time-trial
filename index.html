<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>COASTAL TIME TRIAL — 黄昏海岸计时赛（PBR / PMREM 重构版）</title>
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #0d1018; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
  #app canvas { display: block; width: 100%; height: 100%; }

  #hud {
    position: fixed; right: 30px; bottom: 26px; text-align: right;
    color: #fff; pointer-events: none; user-select: none;
    text-shadow: 0 2px 18px rgba(0,0,0,.65), 0 1px 3px rgba(0,0,0,.5);
  }
  .hud-main { display: flex; align-items: baseline; justify-content: flex-end; gap: 9px; }
  #hud-speed {
    font-size: 76px; line-height: .95; font-weight: 200; letter-spacing: -.045em;
    font-variant-numeric: tabular-nums;
  }
  .unit { font-size: 13px; letter-spacing: .18em; opacity: .72; font-weight: 500; }
  #hud-time {
    margin-top: 8px; font-size: 29px; font-weight: 300; letter-spacing: .015em;
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-variant-numeric: tabular-nums;
  }
  #hud-last { margin-top: 4px; font-size: 11px; letter-spacing: .16em; opacity: .8; min-height: 15px; }

  /* 氮气：只有一根 2px 暖橙细线——无底、无边框、无渐变、无文字（P18 美术约束）。
     只改 #nosBar 的 transform:scaleX()，不改任何影响布局的属性。 */
  #nos {
    width: 120px; height: 2px; margin: 10px 0 0 auto; overflow: hidden;
    pointer-events: none;
  }
  #nosBar {
    display: block; width: 100%; height: 2px; background: #e8a24a;
    transform-origin: 0 50%; transform: scaleX(1);
    will-change: transform; opacity: 1; transition: opacity .7s ease;
  }
  #nosBar.dim { opacity: .45; }

  /* 排行榜：纯文字行，无卡片、无边框、无底（P18）；只有本局那条用暖橙标出 */
  #hud-board {
    margin-top: 14px; text-align: right; opacity: .74; white-space: pre;
    font-size: 11px; line-height: 1.5; letter-spacing: .05em;
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-variant-numeric: tabular-nums;
  }
  #hud-board .lb-h { font-size: 9px; letter-spacing: .3em; opacity: .85; margin-bottom: 3px; }
  #hud-board .lb.new { color: #e8a24a; opacity: 1; }

  #hud-hint {
    position: fixed; left: 30px; bottom: 28px; color: #fff; opacity: .5;
    font-size: 11px; letter-spacing: .07em; line-height: 1.8;
    pointer-events: none; text-shadow: 0 1px 8px rgba(0,0,0,.7);
  }
  #hud-hint b { font-weight: 600; opacity: .92; }
  #hud-boot {
    position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%);
    padding: 26px 38px; border-radius: 14px; text-align: center; color: #fff;
    background: rgba(18,20,28,.42); border: 1px solid rgba(255,255,255,.14);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    transition: opacity 1.1s ease, transform 1.1s ease; pointer-events: none;
  }
  #hud-boot.gone { opacity: 0; transform: translate(-50%, -56%); }
  #hud-boot h1 { margin: 0 0 6px; font-size: 20px; font-weight: 300; letter-spacing: .34em; }
  #hud-boot p { margin: 0; font-size: 11px; opacity: .68; letter-spacing: .1em; }
  #hud-boot.error { opacity: 1; max-width: 78vw; text-align: left; }
  #hud-boot.error strong { color: #ffb4a0; }
  #hud-boot pre { white-space: pre-wrap; word-break: break-all; font-size: 11px; margin: 10px 0 0; }

  /* ================= 触屏 / 小屏适配 =================
     桌面：#touch-ui 默认 display:none，以下控件规则完全不参与布局。
     触屏：控件只把值写进 Input.touch，物理与桌面共用同一套 Input.read()。 */
  #touch-ui {
    display: none; position: fixed; inset: 0; z-index: 20;
    pointer-events: none; touch-action: none;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
    --tc: clamp(50px, 11vmin, 78px); --edge: 14px; --bottom: 16px;
  }
  /* 安全区：不支持 env()/max() 的老 WebView 整块跳过，回退到固定内边距 */
  @supports (padding: max(0px, env(safe-area-inset-left))) {
    #touch-ui { --edge: max(14px, env(safe-area-inset-left));
                --bottom: max(16px, env(safe-area-inset-bottom)); }
  }
  html.tc-on #touch-ui { display: block; }
  .tc-btn {
    position: absolute; pointer-events: auto; box-sizing: border-box;
    display: -webkit-box; display: flex; align-items: center; justify-content: center;
    width: var(--tc, 60px); height: var(--tc, 60px); border-radius: 18px;
    font: 500 13px/1 -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    letter-spacing: .06em; color: #fff; text-align: center;
    background: rgba(18,22,32,.36); border: 1px solid rgba(255,255,255,.24);
    -webkit-appearance: none; appearance: none; outline: none;
    -webkit-tap-highlight-color: transparent; touch-action: none;
    text-shadow: 0 1px 5px rgba(0,0,0,.7);
    -webkit-backdrop-filter: blur(7px); backdrop-filter: blur(7px);
  }
  .tc-btn.down { background: rgba(232,162,74,.5); border-color: rgba(255,214,150,.75); }
  /* 左下：转向 */
  #tc-left  { left: var(--edge, 14px); bottom: var(--bottom, 16px); }
  #tc-right { left: calc(var(--edge, 14px) + var(--tc, 60px) + 10px); bottom: var(--bottom, 16px); }
  /* 右下：油门（大）/ 刹车 / 氮气 / 手刹 */
  #tc-gas {
    right: var(--edge, 14px); bottom: calc(var(--bottom, 16px) + var(--tc, 60px) + 12px);
    width: calc(var(--tc, 60px) * 1.45); height: calc(var(--tc, 60px) * 1.45); border-radius: 24px;
  }
  #tc-brake { right: var(--edge, 14px); bottom: var(--bottom, 16px); }
  #tc-nitro { right: calc(var(--edge, 14px) + var(--tc, 60px) * 1.45 + 12px);
              bottom: calc(var(--bottom, 16px) + var(--tc, 60px) + 12px); }
  #tc-drift { right: calc(var(--edge, 14px) + var(--tc, 60px) * 1.45 + 12px);
              bottom: var(--bottom, 16px); }
  /* 右上：一次性动作，映射到既有 edges → Input.consume */
  #tc-tools { position: absolute; right: var(--edge, 14px); top: 12px;
              top: calc(12px + env(safe-area-inset-top, 0px));
              display: flex; gap: 8px; pointer-events: none; }
  .tc-tool { position: relative; width: auto; min-width: 46px; height: 34px;
             padding: 0 10px; border-radius: 12px; font-size: 11px; pointer-events: auto; }
  /* 竖屏提示（横屏自动隐藏），不阻塞触摸 */
  #tc-tip { display: none; position: fixed; left: 50%; z-index: 21; top: 10px;
            top: calc(10px + env(safe-area-inset-top, 0px)); transform: translateX(-50%);
            pointer-events: none; white-space: nowrap; color: #fff; opacity: .72;
            font-size: 11px; letter-spacing: .08em; text-shadow: 0 1px 6px rgba(0,0,0,.8); }
  html.tc-on #tc-tip { display: block; }
  @media (orientation: landscape) { html.tc-on #tc-tip { display: none; } }

  /* 小屏 HUD：只缩排版，不改 DOM 与更新逻辑；桌面 >820px 完全不触发 */
  @media (max-width: 820px), (max-height: 430px) {
    #hud { right: 14px; bottom: calc(14px + env(safe-area-inset-bottom, 0px)); }
    #hud-speed { font-size: 46px; }
    #hud-time { font-size: 20px; margin-top: 5px; }
    #hud-last { font-size: 10px; }
    #nos { width: 88px; margin-top: 7px; }
    #hud-board { font-size: 9.5px; margin-top: 8px; }
    #hud-hint { left: 14px; bottom: calc(14px + env(safe-area-inset-bottom, 0px)); font-size: 9.5px; }
  }
  /* 触屏设备已有实体控件，键盘提示没有意义；桌面原提示保持不变 */
  html.tc-on #hud-hint { display: none; }
  @media (max-height: 300px) {
    #hud-speed { font-size: 28px; }
    #hud-time { font-size: 14px; }
    #hud-board { display: none; }
    #hud-hint { display: none; }
  }
  @media (orientation: portrait) and (max-width: 820px) {
    #touch-ui { --tc: clamp(46px, 13vw, 66px); }
    html.tc-on #hud { bottom: calc(112px + env(safe-area-inset-bottom, 0px)); }
    #tc-tools { top: calc(30px + env(safe-area-inset-top, 0px)); }
  }
  @media (orientation: landscape) and (max-height: 480px) {
    #touch-ui { --tc: clamp(44px, 13vmin, 64px); }
    #hud-speed { font-size: 32px; }
    #hud-time { font-size: 16px; }
    #hud-board { display: none; }
  }
</style>
</head>
<body>
<div id="app"></div>

<div id="hud">
  <div class="hud-main"><span id="hud-speed">000</span><span class="unit">KM/H</span></div>
  <div id="nos"><i id="nosBar"></i></div>
  <div id="hud-time">0:00.000</div>
  <div id="hud-last"></div>
  <div id="hud-board"><div class="lb-h">TOP</div></div>
</div>

<div id="hud-hint">
  <b>W / ↑</b> 油门　<b>S / ↓</b> 刹车·倒车　<b>A / D</b> 左 / 右转<br>
  <b>SPACE</b> 手刹漂移　<b>SHIFT</b> 氮气　<b>C</b> 切视角　<b>R</b> 复位　<b>ENTER</b> 重开　<b>M</b> 音效
</div>
<div id="hud-boot">
  <h1>COASTAL TIME TRIAL</h1>
  <p>黄昏海岸 · 环形计时赛 — 按任意键出发</p>
</div>

<!-- 触屏控件：默认 display:none，只有检测到触屏设备（html.tc-on）才显示。
     全部通过 Input.touch / Input.press 汇入既有输入状态，桌面端零影响。 -->
<div id="touch-ui">
  <button type="button" class="tc-btn" id="tc-left"  data-act="left"  aria-label="左转">◀</button>
  <button type="button" class="tc-btn" id="tc-right" data-act="right" aria-label="右转">▶</button>
  <button type="button" class="tc-btn" id="tc-gas"   data-act="gas"   aria-label="油门">油门</button>
  <button type="button" class="tc-btn" id="tc-brake" data-act="brake" aria-label="刹车">刹车</button>
  <button type="button" class="tc-btn" id="tc-nitro" data-act="nitro" aria-label="氮气">氮气</button>
  <button type="button" class="tc-btn" id="tc-drift" data-act="drift" aria-label="手刹漂移">漂移</button>
  <div id="tc-tools">
    <button type="button" class="tc-btn tc-tool" id="tc-view"    data-key="KeyC"  aria-label="切换视角">视角</button>
    <button type="button" class="tc-btn tc-tool" id="tc-reset"   data-key="KeyR"  aria-label="原地复位">复位</button>
    <button type="button" class="tc-btn tc-tool" id="tc-restart" data-key="Enter" aria-label="重新开始">重开</button>
    <button type="button" class="tc-btn tc-tool" id="tc-audio"   data-key="KeyM"  aria-label="音效开关">音效</button>
  </div>
</div>
<div id="tc-tip">横屏体验更好 · 竖屏也可直接游玩</div>

<!-- three r149 UMD：最后一个提供 build/three.min.js 的版本 -->
<script src="lib/three.min.js?v=20261112d" onerror="document.getElementById('hud-boot').innerHTML='<h1>缺少 lib/three.min.js</h1>'"></script>
<!-- 依赖顺序：rng → geo → textures → track → sky(ATMOS 字符串) → terrain → snow → ocean → road -->
<script src="src/rng.js?v=20261112d"></script>
<script src="src/geo.js?v=20261112d"></script>
<script src="src/textures.js?v=20261112d"></script>
<script src="src/track.js?v=20261112d"></script>
<script src="src/sky.js?v=20261112d"></script>
<script src="src/terrain.js?v=20261112d"></script>
<script src="src/snowmountain.js?v=20261112d"></script>
<script src="src/ocean.js?v=20261112d"></script>
<script src="src/road.js?v=20261112d"></script>
<script src="src/props.js?v=20261112d"></script>
<script src="src/car.js?v=20261112d"></script>
<script src="src/effects.js?v=20261112d"></script>
<script src="src/confetti.js?v=20261112d"></script>

<script src="src/record.js?v=20261112d"></script>

<script src="src/camera.js?v=20261112d"></script>

<script src="src/main.js?v=20261112d"></script>
<script>
  setTimeout(function () {
    var b = document.getElementById('hud-boot');
    if (b && b.className !== 'error') b.className = 'gone';
  }, 3500);
  window.addEventListener('keydown', function once() {
    var b = document.getElementById('hud-boot');
    if (b && b.className !== 'error') b.className = 'gone';
    window.removeEventListener('keydown', once);
  });
</script>
</body>
</html>
