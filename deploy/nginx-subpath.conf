# 子路径部署：把游戏挂在已有站点下（不用新域名 / 新证书）
#
# 用法：把本文件放到 /etc/nginx/snippets/coastal-race.conf，
# 在已有站点的 server { } 里加一行：
#     include /etc/nginx/snippets/coastal-race.conf;
#
# 前置：/etc/nginx/conf.d/00-websocket-upgrade-map.conf 里定义 $connection_upgrade
#       （见同目录 nginx-ws-map.conf）
# 效果：https://www.example.com/race/  →  127.0.0.1:8787
# 客户端会自动把 WS 连到 wss://www.example.com/race/ws

location = /race {
    return 301 https://$host/race/;
}
location ^~ /race/ {
    proxy_pass http://127.0.0.1:8787/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    # 大厅挂机连接要能一直挂着
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;
}
